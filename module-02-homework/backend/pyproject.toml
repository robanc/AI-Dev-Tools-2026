[project]
name = "tasklane-backend"
version = "0.1.0"
description = "TaskLane FastAPI backend with SQLAlchemy persistence"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyyaml>=6,<7", "openapi-spec-validator>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
