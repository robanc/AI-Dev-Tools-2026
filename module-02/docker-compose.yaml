services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pairroom
      POSTGRES_PASSWORD: pairroom
      POSTGRES_DB: pairroom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ${APP_IMAGE:-pairroom:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pairroom:pairroom@postgres:5432/pairroom
      FRONTEND_ORIGINS: http://localhost:8100,http://127.0.0.1:8100
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"

volumes:
  postgres-data:
