name: pairroom-observability

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  otel-collector:
    <<: *runtime
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./collector.yaml:/etc/otelcol/config.yaml:ro]
    ports: ['127.0.0.1:4318:4318']
    networks: [default, telemetry]
    mem_limit: 384m
    cpus: 1.0

  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 1.0

  loki:
    <<: *runtime
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    cpus: 1.0

  tempo:
    <<: *runtime
    image: grafana/tempo:2.10.8
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m
    cpus: 1.0

  grafana:
    <<: *runtime
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
    mem_limit: 512m
    cpus: 1.0

networks:
  telemetry:
    name: pairroom-telemetry

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./.secrets/grafana-admin-password}
