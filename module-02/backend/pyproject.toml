[project]
name = "pairroom-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
    "websockets>=14,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "openapi-spec-validator>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
